{% extends 'blog/base.html' %}
{% load my_tags %}
{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            {% for note in object_list %}
            <div class="col">
                <div class="card shadow-sm">
                    <div class="card-img-top"
                         style="height: 225px; width: 100%;
            background: linear-gradient(rgba(85, 89, 92, 0.7), rgba(85, 89, 92, 0.7)),
                        url('{{ note.preview | media_filter }}') center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #eceeef;
            font-size: 1.2rem;">
                        {{ note.title }}
                    </div>
                    <div class="card-body"><p class="card-text">{{ note.get_content }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <a class="btn btn-sm btn-outline-secondary" role="button" href="{% url 'blog:notes_detail' note.pk %}">Читать</a>
                            <a class="btn btn-sm btn-outline-secondary" role="button" href="{% url 'blog:notes_update' note.pk %}">Редактировать</a>
                            <a class="btn btn-sm btn-outline-secondary" role="button" href="{% url 'blog:notes_delete' note.pk %}">Удалить</a>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
